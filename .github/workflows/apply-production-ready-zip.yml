name: Apply production-ready ZIP updates
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Plexy
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and verify uploaded archive
        env:
          ZIP_URL: https://id-preview--31897b4a-c6dc-4c2c-a48f-3fed6d120a7c.lovable.app/__l5e/assets-v1/4059efa5-014b-4ca2-80a7-2169c7e800b6/plexy-production-ready.zip
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$ZIP_URL" -o /tmp/plexy-production-ready.zip
          echo '6c24af2b4aeb6948b38a0f506c892fafa008f73585817cbf3545c629a24c2af5  /tmp/plexy-production-ready.zip' | sha256sum --check
      - name: Overlay ZIP files without deleting Plexy-only files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil, stat
          archive = Path('/tmp/plexy-production-ready.zip')
          stage = Path('/tmp/plexy-production-ready')
          stage.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if len(entries) != 759:
                  raise SystemExit(f'Expected 759 files, got {len(entries)}')
              for info in z.infolist():
                  path = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0o170000
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename or (path.parts and path.parts[0] == '.git'):
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'Symlink not allowed: {info.filename}')
                  if info.is_dir():
                      continue
                  target = stage.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          copied = 0
          for source in stage.rglob('*'):
              if source.is_file():
                  target = Path.cwd() / source.relative_to(stage)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  copied += 1
          if copied != 759:
              raise SystemExit(f'Expected to overlay 759 files, overlaid {copied}')
          print(f'Overlaid {copied} ZIP files; no destination-only files were removed.')
          PY
      - name: Commit only the resulting file changes
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-production-ready-zip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No file changes to commit.'; exit 0; }
          git commit -m 'Apply production-ready ZIP updates'
          git push origin HEAD:main
