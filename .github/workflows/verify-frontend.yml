name: Verify frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/merge-pezir-cleanup-20261122]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh pnpm lockfile after workspace cleanup"
            git push
          fi
      - name: Typecheck
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
