name: Compare Pexly Project Import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download prepared archive
        env:
          ARCHIVE_URL: ${{ secrets.PEXLY_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_URL" || { echo "PEXLY_ARCHIVE_URL secret is not configured"; exit 1; }
          curl --fail --location --retry 3 "$ARCHIVE_URL" --output /tmp/plexy-production-ready.zip

      - name: Extract safely and compare
        run: |
          set -euo pipefail
          mkdir -p /tmp/plexy-import /tmp/plexy-candidate
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          archive = "/tmp/plexy-production-ready.zip"
          target = "/tmp/plexy-import"
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  if item.is_dir():
                      continue
                  out = __import__("pathlib").Path(target).joinpath(*p.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(item) as src, out.open("wb") as dst:
                      __import__("shutil").copyfileobj(src, dst)
          PY

          # Handle a single enclosing folder, if the archive has one.
          SRC=/tmp/plexy-import
          if [ ! -f "$SRC/package.json" ] && [ -f "$(find "$SRC" -mindepth 2 -maxdepth 2 -name package.json -print -quit)" ]; then
            ROOT_PACKAGE="$(find "$SRC" -mindepth 2 -maxdepth 2 -name package.json -print -quit)"
            SRC="$(dirname "$ROOT_PACKAGE")"
          fi

          python3 - "$SRC" "$GITHUB_WORKSPACE" /tmp/plexy-candidate report.md <<'PY'
          import hashlib, os, shutil, sys
          from pathlib import Path
          src, repo, candidate, report = map(Path, sys.argv[1:])
          ignored = {".git", "node_modules", ".vercel"}
          def files(root):
              out = {}
              for base, dirs, names in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ignored]
                  for name in names:
                      p = Path(base) / name
                      rel = p.relative_to(root)
                      if rel.as_posix() == ".github/workflows/import-plexy.yml":
                          continue
                      out[rel.as_posix()] = p
              return out
          incoming, existing = files(src), files(repo)
          def digest(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.digest()
          added, changed, same, missing = [], [], [], []
          for rel, p in sorted(incoming.items()):
              old = existing.get(rel)
              if old is None:
                  added.append(rel)
              elif digest(p) == digest(old):
                  same.append(rel)
              else:
                  changed.append(rel)
          for rel in sorted(existing):
              if rel not in incoming and rel != ".github/workflows/import-plexy.yml":
                  missing.append(rel)
          for rel in added + changed:
              dest = candidate / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(incoming[rel], dest)
          lines = [
              "# Pexly import comparison",
              "",
              f"- Incoming files: {len(incoming)}",
              f"- New files: {len(added)}",
              f"- Modified files: {len(changed)}",
              f"- Unchanged files: {len(same)}",
              f"- Files present in main but absent from ZIP (NOT deleted): {len(missing)}",
              "",
          ]
          for title, items in [
              ("New files", added), ("Modified files", changed),
              ("Unchanged files", same), ("Missing from ZIP — review only, no deletion", missing)
          ]:
              lines += [f"## {title}", ""]
              lines += [f"- `{x}`" for x in items] or ["- None"]
              lines += [""]
          report.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines[:10]))
          PY

      - name: Package comparison report and candidate files
        run: |
          set -euo pipefail
          mkdir -p /tmp/plexy-review
          cp report.md /tmp/plexy-review/report.md
          tar -czf /tmp/plexy-review/new-and-modified-files.tar.gz -C /tmp/plexy-candidate .
          cp /tmp/plexy-review/report.md "$GITHUB_STEP_SUMMARY"

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: pexly-import-review
          path: /tmp/plexy-review/
          if-no-files-found: error
          retention-days: 7
