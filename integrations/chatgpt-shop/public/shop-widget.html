<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pexly Shop</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#171717;background:#fff}
*{box-sizing:border-box}body{margin:0;padding:16px}header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#171717;color:#fff;font-weight:800;letter-spacing:-1px}
.brand{font-weight:750;font-size:17px}.sub{font-size:12px;color:#737373;margin-top:2px}
#status{font-size:13px;color:#737373;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.card{overflow:hidden;border:1px solid #e5e5e5;border-radius:14px;background:white;display:flex;flex-direction:column;min-width:0}
.image{width:100%;aspect-ratio:1.15;background:#f5f5f5;object-fit:contain;display:block}
.body{padding:11px;display:flex;flex-direction:column;gap:7px;flex:1}
.name{font-size:14px;line-height:1.35;font-weight:650;overflow-wrap:anywhere}
.type{font-size:11px;color:#737373}.price{font-size:15px;font-weight:750}
.avail{font-size:11px;color:#15803d}.unavail{font-size:11px;color:#b91c1c}
a.cta{display:block;text-align:center;text-decoration:none;background:#171717;color:white;border-radius:9px;padding:9px 10px;font-size:12px;font-weight:650;margin-top:auto}
a.cta:focus-visible{outline:2px solid #737373;outline-offset:2px}
.empty{padding:18px;border:1px dashed #d4d4d4;border-radius:12px;color:#737373;font-size:13px}
footer{font-size:11px;color:#737373;margin-top:14px}
</style>
</head>
<body>
<header><div class="mark">P</div><div><div class="brand">Pexly Shop</div><div class="sub">Discover something useful</div></div></header>
<div id="status">Loading product results…</div><main id="results" class="grid"></main>
<footer>Product details and availability may change. Purchases are completed securely on pexly.app.</footer>
<script>
(function(){
 const status=document.getElementById('status'), results=document.getElementById('results');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=p=>{if(!p||p.amount==null)return 'See price on Pexly';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:p.currency||'USD'}).format(Number(p.amount))}catch{return esc(p.amount)+' '+esc(p.currency||'')}};
 function render(data){
   const payload=data?.structuredContent??data?.toolOutput??data;
   const list=Array.isArray(payload?.products)?payload.products:(payload?.handle?[payload]:[]);
   results.replaceChildren();
   if(!list.length){status.textContent='Search Pexly products in the chat to see matching items here.';return}
   status.textContent=payload?.query?'Results for “'+payload.query+'” · '+list.length+' item'+(list.length===1?'':'s'):list.length+' product'+(list.length===1?'':'s');
   for(const p of list){
     const card=document.createElement('article');card.className='card';
     const img=document.createElement('img');img.className='image';img.alt=p.images?.[0]?.alt||p.title||'Pexly product';img.loading='lazy';img.src=p.images?.[0]?.url||'';img.onerror=()=>{img.style.visibility='hidden'};card.appendChild(img);
     const body=document.createElement('div');body.className='body';
     const type=document.createElement('div');type.className='type';type.textContent=p.productType||'PEXLY PRODUCT';body.appendChild(type);
     const name=document.createElement('div');name.className='name';name.textContent=p.title||'Product';body.appendChild(name);
     const price=document.createElement('div');price.className='price';price.textContent=money(p.price);body.appendChild(price);
     if(p.available!==null&&p.available!==undefined){const a=document.createElement('div');a.className=p.available?'avail':'unavail';a.textContent=p.available?'Available':'Check availability';body.appendChild(a)}
     const link=document.createElement('a');link.className='cta';link.href=p.url||'https://pexly.app';link.target='_blank';link.rel='noopener noreferrer';link.textContent='View on Pexly';body.appendChild(link);
     card.appendChild(body);results.appendChild(card);
   }
 }
 function readHostOutput(){
   const host=window.openai;
   if(host?.toolOutput){render(host.toolOutput);return true}
   if(host?.toolResponseMetadata?.structuredContent){render(host.toolResponseMetadata.structuredContent);return true}
   return false;
 }
 if(!readHostOutput()) status.textContent='Search for a product in ChatGPT and choose Pexly Shop to view matching products.';
 window.addEventListener('openai:tool_output',readHostOutput);
 window.addEventListener('message',event=>{
   if(event.source!==window.parent||!event.data)return;
   const m=event.data;
   if(m.type==='ui/notifications/tool-result')render(m.params?.structuredContent??m.params?.content);
 });
})();
</script>
</body>
</html>
